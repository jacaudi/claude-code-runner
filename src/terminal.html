<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>">
  <title>Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    .toolbar h1 {
      font-size: 14px;
      color: #58a6ff;
      white-space: nowrap;
    }
    .toolbar .task-id {
      font-family: monospace;
      color: #f0883e;
      font-size: 13px;
    }
    .toolbar .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .toolbar .status-dot.connected { background: #3fb950; }
    .toolbar .status-dot.disconnected { background: #f85149; }
    .toolbar .status-dot.connecting { background: #f0883e; }
    .toolbar .status-text {
      font-size: 12px;
      color: #8b949e;
    }
    .toolbar .viewers {
      font-size: 12px;
      color: #8b949e;
      margin-left: auto;
    }
    .toolbar .back-link {
      color: #58a6ff;
      text-decoration: none;
      font-size: 13px;
    }
    .toolbar .back-link:hover { text-decoration: underline; }
    #terminal-container {
      flex: 1;
      padding: 4px;
      overflow: hidden;
    }
    .overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px 32px;
      text-align: center;
      z-index: 100;
    }
    .overlay.visible { display: block; }
    .overlay h2 { color: #f85149; margin-bottom: 8px; font-size: 16px; }
    .overlay p { color: #8b949e; font-size: 14px; }
    .overlay button {
      margin-top: 16px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .overlay button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="/" class="back-link">Dashboard</a>
    <h1>Terminal</h1>
    <span class="task-id" id="task-id"></span>
    <span class="status-dot connecting" id="status-dot"></span>
    <span class="status-text" id="status-text">Connecting...</span>
    <span class="viewers" id="viewers"></span>
  </div>
  <div id="terminal-container"></div>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Disconnected</h2>
    <p id="overlay-message">Connection lost</p>
    <button onclick="connect()">Reconnect</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script>
    // Extract task ID from URL: /task/:id/terminal
    const pathParts = window.location.pathname.split('/');
    const taskId = pathParts[2];
    document.getElementById('task-id').textContent = taskId;
    document.title = `Terminal: ${taskId}`;

    // Initialize xterm.js
    const term = new window.Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace",
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        selectionBackground: '#264f78',
        black: '#484f58',
        red: '#ff7b72',
        green: '#3fb950',
        yellow: '#d29922',
        blue: '#58a6ff',
        magenta: '#bc8cff',
        cyan: '#39d353',
        white: '#b1bac4',
        brightBlack: '#6e7681',
        brightRed: '#ffa198',
        brightGreen: '#56d364',
        brightYellow: '#e3b341',
        brightBlue: '#79c0ff',
        brightMagenta: '#d2a8ff',
        brightCyan: '#56d364',
        brightWhite: '#f0f6fc',
      },
      allowProposedApi: true,
    });

    const fitAddon = new window.FitAddon.FitAddon();
    const webLinksAddon = new window.WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    let ws = null;
    let reconnectTimer = null;

    function setStatus(state, text) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-text');
      dot.className = 'status-dot ' + state;
      label.textContent = text;
    }

    function showOverlay(title, message) {
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-message').textContent = message;
      document.getElementById('overlay').classList.add('visible');
    }

    function hideOverlay() {
      document.getElementById('overlay').classList.remove('visible');
    }

    function connect() {
      hideOverlay();
      setStatus('connecting', 'Connecting...');

      if (ws) {
        ws.close();
        ws = null;
      }

      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${window.location.host}/task/${taskId}/terminal/ws`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        setStatus('connected', 'Connected');
        term.focus();

        // Send initial terminal size
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          switch (msg.type) {
            case 'output':
              term.write(msg.data);
              break;

            case 'exit':
              setStatus('disconnected', `Process exited (code: ${msg.exitCode})`);
              showOverlay(
                msg.exitCode === 0 ? 'Process Complete' : 'Process Exited',
                `Exit code: ${msg.exitCode}`
              );
              break;

            case 'error':
              setStatus('disconnected', msg.message || 'Error');
              showOverlay('Error', msg.message || 'Unknown error');
              break;
          }
        } catch {
          // Raw data fallback
          term.write(event.data);
        }
      };

      ws.onclose = (event) => {
        if (event.code !== 1000) {
          setStatus('disconnected', 'Disconnected');
          // Auto-reconnect after 3 seconds
          reconnectTimer = setTimeout(connect, 3000);
        }
      };

      ws.onerror = () => {
        setStatus('disconnected', 'Connection error');
      };
    }

    // Forward keystrokes to the WebSocket
    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data }));
      }
    });

    // Forward terminal resize events
    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      }
    });

    // Observe container resize (handles sidebar toggles, etc.)
    const resizeObserver = new ResizeObserver(() => {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      }
    });
    resizeObserver.observe(document.getElementById('terminal-container'));

    // Start connection
    connect();

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      clearTimeout(reconnectTimer);
      if (ws) ws.close(1000, 'Page closed');
    });
  </script>
</body>
</html>
