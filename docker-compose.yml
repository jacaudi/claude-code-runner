services:
  claude-runner:
    image: ericvtheg/claude-code-runner
    container_name: claude-code-runner
    ports:
      - "7334:3000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - CLAUDE_CODE_USE_VERTEX=${CLAUDE_CODE_USE_VERTEX:-}
      - PORT=3000
      - DISPATCH_MODE=${DISPATCH_MODE:-local}
    volumes:
      # Copy-not-mount: credentials staged here, copied by entrypoint.sh
      # to /home/node/.claude/ with proper permissions at startup
      - ~/.claude/.credentials.json:/tmp/.credentials-staging/.credentials.json:ro
      - claude-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  claude-data:
