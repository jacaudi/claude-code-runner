apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-controller
  namespace: claude-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-controller
  namespace: claude-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-controller
  namespace: claude-system
subjects:
  - kind: ServiceAccount
    name: claude-controller
    namespace: claude-system
roleRef:
  kind: Role
  name: claude-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-controller
  namespace: claude-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-controller
  template:
    metadata:
      labels:
        app: claude-controller
    spec:
      serviceAccountName: claude-controller
      containers:
        - name: controller
          image: ghcr.io/jacaudi/claude-code-runner:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/server.js"]
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTROLLER_SERVICE
              value: claude-controller
            - name: WORKER_IMAGE
              value: ghcr.io/jacaudi/claude-code-runner:latest
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claude-controller
  namespace: claude-system
spec:
  selector:
    app: claude-controller
  ports:
    - port: 80
      targetPort: 3000
