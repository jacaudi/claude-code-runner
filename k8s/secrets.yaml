# IMPORTANT: Replace placeholder values before applying
# Generate base64: echo -n 'value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: claude-credentials
  namespace: claude-system
type: Opaque
data:
  # Base64-encoded contents of ~/.claude/.credentials.json
  .credentials.json: REPLACE_WITH_BASE64_CREDENTIALS
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: claude-system
type: Opaque
data:
  # Base64-encoded GitHub token
  token: REPLACE_WITH_BASE64_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: claude-system
type: Opaque
stringData:
  password: "REPLACE_WITH_SECURE_PASSWORD"
  url: "postgresql://claude:REPLACE_WITH_SECURE_PASSWORD@postgres.claude-system.svc.cluster.local:5432/claude"
