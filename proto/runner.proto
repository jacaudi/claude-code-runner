syntax = "proto3";

package clauderunner;

// ============================================================
// RunnerService — exposed by each Runner container.
// Controller connects to each Runner via its unique Unix socket.
// ============================================================

service RunnerService {
  // Execute a task (orchestrator + worker phases, or worker-only for project tasks).
  // Controller sends config files and optional project context in the request.
  // Runner streams back logs, status changes, artifacts, and final result.
  rpc ExecuteTask(ExecuteTaskRequest) returns (stream TaskEvent);

  // Cancel a running task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Health check — lets the Controller verify the Runner is alive.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Drain — tell Runner to stop accepting new tasks and finish current ones.
  // Used before tearing down persistent runners or rotating ephemeral ones.
  rpc Drain(DrainRequest) returns (DrainResponse);
}

// ============ Shared: Config & Artifact Files ============

message ConfigFile {
  string path = 1;        // Relative path within scope (e.g. "rules/security.md", ".mcp.json")
  bytes content = 2;      // Raw file content
  ConfigScope scope = 3;  // Where to deploy the file
  ConfigType type = 4;    // What kind of config this is (for validation/routing)
}

enum ConfigScope {
  CONFIG_SCOPE_PROJECT = 0;  // Deploy relative to repo working directory
  CONFIG_SCOPE_USER = 1;     // Deploy relative to ~/.claude/
}

enum ConfigType {
  CONFIG_TYPE_SKILL = 0;   // Skill definition  -> .claude/skills/<name>/SKILL.md
  CONFIG_TYPE_MCP = 1;     // MCP server config -> .mcp.json (project) or ~/.claude/settings.local.json
  CONFIG_TYPE_RULE = 2;    // Rule file         -> .claude/rules/<name>.md or CLAUDE.md
  CONFIG_TYPE_PLAN = 3;    // Plan file         -> .claude/plans/<name>.md
  CONFIG_TYPE_OTHER = 4;   // Generic file      -> deployed at exact path
}

message Artifact {
  string path = 1;           // Relative path where the file was found
  bytes content = 2;         // Raw file content
  ArtifactType type = 3;     // Classification
  string task_id = 4;        // Originating task
}

enum ArtifactType {
  ARTIFACT_TYPE_PLAN = 0;
  ARTIFACT_TYPE_RULE = 1;
  ARTIFACT_TYPE_SKILL = 2;
  ARTIFACT_TYPE_OTHER = 3;
}

// ============ Project Context ============

// Sent by Controller when a task is associated with a registered project.
// When present, the Runner skips the orchestrator phase entirely — the
// worktree is already mounted, the branch is already checked out.
message ProjectContext {
  string project_id = 1;       // Controller's project ID
  string repo_name = 2;        // Human-readable repo name (e.g. "my-api")
  string branch_name = 3;      // Branch already checked out in the mounted worktree
  string default_branch = 4;   // For reference (e.g. "main")
  string forge_type = 5;       // "github" | "forgejo" | "gitlab"

  // Issue context (if task is for a specific issue)
  string issue_number = 6;     // Forge issue number, for PR cross-references
  string issue_title = 7;      // For commit messages and PR titles
  string issue_url = 8;        // Full URL for linking in PR body
}

// ============ ExecuteTask ============

message ExecuteTaskRequest {
  string task_id = 1;                  // Controller-assigned ID
  string prompt = 2;                   // User's task prompt
  string github_token = 3;            // Forwarded from Controller (also used for Forgejo)
  string anthropic_api_key = 4;       // Optional

  repeated ConfigFile config_files = 5;

  // If set, Runner skips orchestrator phase and works directly in the
  // pre-mounted worktree. The Controller handles repo cloning, worktree
  // creation, and branch setup before dispatching the task.
  ProjectContext project_context = 6;
}

message TaskEvent {
  string task_id = 1;
  TaskEventType type = 2;

  // Exactly one of the following is populated depending on `type`.
  string log_line = 3;           // for LOG
  TaskStatus status_update = 4;  // for STATUS_CHANGE
  TaskResult result = 5;         // for RESULT (terminal)
  Artifact artifact = 6;         // for ARTIFACT
}

enum TaskEventType {
  LOG = 0;
  STATUS_CHANGE = 1;
  RESULT = 2;
  ARTIFACT = 3;
}

message TaskStatus {
  string status = 1;  // "running", "orchestrator", "worker"
  string phase = 2;   // "orchestrator" | "worker" | ""
}

message TaskResult {
  bool success = 1;
  string error_message = 2;
  string error_type = 3;     // "timeout" | "exit_code" | "auth_expired" | "capacity_reached" | "cancelled" | ""
  string pr_url = 4;         // Extracted PR/MR URL
  string branch_name = 5;    // Branch the work was done on (useful for Controller to track)
}

// ============ CancelTask ============

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  bool acknowledged = 1;
}

// ============ HealthCheck ============

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  int32 running_tasks = 2;
  int32 max_concurrent_tasks = 3;
  string runner_id = 4;
}

// ============ Drain ============

message DrainRequest {}

message DrainResponse {
  bool acknowledged = 1;
  int32 remaining_tasks = 2;
}
